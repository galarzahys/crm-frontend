<div class="flex flex-col gap-4">
  @if (error()) {
    <div class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-400">
      {{ error() }}
    </div>
  }

  <div class="flex flex-col gap-1.5">
    <label for="atributo-nombre" class="text-sm font-medium text-surface-700 dark:text-surface-300">Nombre</label>
    <input
      id="atributo-nombre"
      type="text"
      pInputText
      [(ngModel)]="nombre"
      placeholder="Ej: Color, Alto, Material"
      class="w-full"
    />
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="flex flex-col gap-1.5">
      <label for="atributo-unidad" class="text-sm font-medium text-surface-700 dark:text-surface-300">
        Unidad de medida <span class="font-normal text-surface-400">(opcional)</span>
      </label>
      <input
        id="atributo-unidad"
        type="text"
        pInputText
        [(ngModel)]="unidadMedida"
        placeholder="Ej: cm, kg"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">Tipo de valor</label>
      <p-select
        [options]="tiposDisponibles"
        optionLabel="etiqueta"
        optionValue="valor"
        [(ngModel)]="tipo"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
  </div>

  @if (esOpciones) {
    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">Opciones</label>
      @for (opcion of opciones; track $index) {
        <div class="flex items-center gap-2">
          <input
            type="text"
            pInputText
            [(ngModel)]="opciones[$index]"
            [placeholder]="'Opción ' + ($index + 1)"
            class="w-full"
          />
          <button
            type="button"
            (click)="quitarOpcion($index)"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-surface-400 transition-colors hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10"
            aria-label="Quitar opción"
          >
            <i class="pi pi-trash text-sm"></i>
          </button>
        </div>
      }
      <button
        type="button"
        (click)="agregarOpcion()"
        class="mt-1 flex w-fit items-center gap-2 text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400"
      >
        <i class="pi pi-plus text-xs"></i>
        Agregar opción
      </button>
    </div>
  }

  <div class="mt-2 flex justify-end gap-2">
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="cancelar()" />
    <p-button [label]="esEdicion ? 'Guardar cambios' : 'Crear atributo'" [loading]="guardando()" (onClick)="guardar()" />
  </div>
</div>
