<header
  class="sticky top-0 z-20 flex h-16 shrink-0 items-center justify-between gap-4 border-b border-surface-200 bg-white/80 px-4 backdrop-blur-sm dark:border-surface-800 dark:bg-surface-900/80 sm:px-6"
>
  <div class="flex items-center gap-3">
    <!-- Botón hamburguesa: solo en mobile/tablet, abre la barra como panel superpuesto -->
    <button
      type="button"
      (click)="layout.alternarMobile()"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-600 transition-colors hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-800 lg:hidden"
      aria-label="Abrir menú de navegación"
    >
      <i class="pi pi-bars text-lg"></i>
    </button>

    <h1 class="text-sm font-medium text-surface-500 dark:text-surface-400 sm:text-base">
      Panel de gestión
    </h1>
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="theme.alternarTema()"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-surface-600 transition-colors hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-800"
      [attr.aria-label]="theme.tema() === 'claro' ? 'Activar modo oscuro' : 'Activar modo claro'"
      [title]="theme.tema() === 'claro' ? 'Activar modo oscuro' : 'Activar modo claro'"
    >
      <i class="pi" [class.pi-moon]="theme.tema() === 'claro'" [class.pi-sun]="theme.tema() === 'oscuro'"></i>
    </button>

    <div class="ml-1 flex h-9 w-9 items-center justify-center rounded-full bg-surface-200 text-sm font-semibold text-surface-700 dark:bg-surface-700 dark:text-surface-100">
      AR
    </div>
  </div>
</header>
