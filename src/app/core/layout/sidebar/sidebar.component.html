<!-- Fondo oscuro semitransparente detrás del panel, solo en mobile/tablet cuando está abierto -->
@if (layout.abiertoMobile()) {
  <div
    class="fixed inset-0 z-30 bg-surface-950/50 lg:hidden"
    (click)="cerrarEnMobile()"
  ></div>
}

<aside
  class="fixed inset-y-0 left-0 z-40 flex flex-col border-r border-surface-200 bg-white transition-all duration-200 ease-in-out dark:border-surface-800 dark:bg-surface-900 lg:static lg:z-auto lg:translate-x-0"
  [class.w-72]="layout.abiertoMobile() || !layout.colapsado()"
  [class.w-20]="!layout.abiertoMobile() && layout.colapsado()"
  [class.-translate-x-full]="!layout.abiertoMobile()"
  [class.translate-x-0]="layout.abiertoMobile()"
>
  <!-- Marca / nombre de la app -->
  <div class="flex h-16 shrink-0 items-center gap-2 border-b border-surface-200 px-4 dark:border-surface-800">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-white">
      <i class="pi pi-th-large text-lg"></i>
    </div>
    @if (!layout.colapsado() || layout.abiertoMobile()) {
      <span class="truncate text-base font-semibold text-surface-900 dark:text-surface-0">TRAFUL</span>
    }
  </div>

  <!-- Navegación -->
  <nav class="flex-1 overflow-y-auto px-3 py-4">
    <ul class="flex flex-col gap-1">
      @for (item of items; track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            routerLinkActive="bg-primary-50 text-primary-700 dark:bg-primary-500/15 dark:text-primary-300"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="cerrarEnMobile()"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-surface-600 transition-colors hover:bg-surface-100 hover:text-surface-900 dark:text-surface-300 dark:hover:bg-surface-800 dark:hover:text-surface-0"
            [class.justify-center]="layout.colapsado() && !layout.abiertoMobile()"
            [title]="item.etiqueta"
          >
            <i class="{{ item.icono }} text-lg"></i>
            @if (!layout.colapsado() || layout.abiertoMobile()) {
              <span class="truncate">{{ item.etiqueta }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Pie: botón de colapsar (solo laptop/desktop) -->
  <div class="hidden border-t border-surface-200 p-3 dark:border-surface-800 lg:block">
    <button
      type="button"
      (click)="layout.alternarColapsado()"
      class="flex w-full items-center justify-center gap-2 rounded-lg py-2 text-sm text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-900 dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-surface-0"
      [attr.aria-label]="layout.colapsado() ? 'Expandir menú' : 'Contraer menú'"
    >
      <i class="pi" [class.pi-angle-double-right]="layout.colapsado()" [class.pi-angle-double-left]="!layout.colapsado()"></i>
      @if (!layout.colapsado()) {
        <span>Contraer menú</span>
      }
    </button>
  </div>
</aside>
